repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: biome
        name: biome
        entry: bash -c 'cd web && bun run lint'
        language: system
        types_or: [ts, tsx]
        pass_filenames: false

  - repo: local
    hooks:
      - id: typecheck
        name: typecheck
        entry: bash -c 'cd web && bun run typecheck'
        language: system
        types_or: [ts, tsx]
        pass_filenames: false

  - repo: local
    hooks:
      - id: knip
        name: knip
        entry: bash -c 'cd web && bunx knip'
        language: system
        types_or: [ts, tsx]
        pass_filenames: false
